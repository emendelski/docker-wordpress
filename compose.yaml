# WordPress configuration shared by the wordpress and wpcli services. The
# image's wp-config.php reads these at runtime, so changes apply on restart.
x-wordpress-env: &wordpress-env
  WORDPRESS_DB_HOST: db
  WORDPRESS_DB_NAME: ${DB_NAME:-wordpress}
  WORDPRESS_DB_USER: ${DB_USER:-wordpress}
  WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:-wordpress}
  # The image does define('WP_DEBUG', !!getenv_docker('WORDPRESS_DEBUG', '')):
  # ANY non-empty value is truthy, including the literal "false". Leave it
  # empty to disable debugging.
  WORDPRESS_DEBUG: ${WORDPRESS_DEBUG-1}
  # Read natively by wp_get_environment_type().
  WP_ENVIRONMENT_TYPE: ${WP_ENVIRONMENT_TYPE:-local}
  WORDPRESS_CONFIG_EXTRA: |
    define('WP_DEBUG_LOG', true);
    define('WP_HOME', 'http://localhost:${WP_PORT:-8080}');
    define('WP_SITEURL', 'http://localhost:${WP_PORT:-8080}');

services:
  wordpress:
    build:
      context: .
      target: wordpress
    ports:
      - ${BIND_ADDRESS:-127.0.0.1}:${WP_PORT:-8080}:80
    volumes:
      - ./public:/var/www/html
      - ./plugins:/var/www/html/wp-content/plugins
      - ./themes:/var/www/html/wp-content/themes
      - ./uploads:/var/www/html/wp-content/uploads
      - ./mu-plugins:/var/www/html/wp-content/mu-plugins
      - ./phpconf.ini:/usr/local/etc/php/conf.d/phpconf.ini
    extra_hosts:
      # Lets Xdebug reach the IDE on Linux hosts too (built in on Docker Desktop).
      - host.docker.internal:host-gateway
    environment:
      <<: *wordpress-env
      XDEBUG_MODE: ${XDEBUG_MODE:-debug}
    # Healthy once the entrypoint has copied WordPress core into ./public and
    # written wp-config.php, so wpcli can run against it.
    healthcheck:
      test: [CMD, test, -f, /var/www/html/wp-config.php]
      interval: 2s
      timeout: 2s
      retries: 30
    depends_on:
      mailpit:
        condition: service_started
      db:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:v1.34
    ports:
      - ${BIND_ADDRESS:-127.0.0.1}:${MAILPIT_PORT:-8025}:8025
      - ${BIND_ADDRESS:-127.0.0.1}:${MAILPIT_SMTP_PORT:-1025}:1025

  # Runs ./wp.sh on every `docker compose up`, then exits. For one-off
  # commands: docker compose run --rm wpcli wp <command>
  wpcli:
    build:
      context: .
      target: cli
    # Keep these in sync with the wordpress service.
    volumes:
      - ./public:/var/www/html
      - ./plugins:/var/www/html/wp-content/plugins
      - ./themes:/var/www/html/wp-content/themes
      - ./uploads:/var/www/html/wp-content/uploads
      - ./mu-plugins:/var/www/html/wp-content/mu-plugins
      - ./wp.sh:/usr/local/bin/wp.sh:ro
    environment:
      <<: *wordpress-env
      HOME: /tmp
    command: [sh, /usr/local/bin/wp.sh]
    depends_on:
      wordpress:
        condition: service_healthy
      mailpit:
        condition: service_started

  db:
    image: mariadb:lts
    ports:
      - ${BIND_ADDRESS:-127.0.0.1}:${DB_PORT:-3308}:3306
    volumes:
      - db_data:/var/lib/mysql
    environment:
      MARIADB_DATABASE: ${DB_NAME:-wordpress}
      MARIADB_USER: ${DB_USER:-wordpress}
      MARIADB_PASSWORD: ${DB_PASSWORD:-wordpress}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-docker}
    # Lets wordpress (and anything scripted right after `up -d`) wait for the
    # first-run initialisation instead of racing it.
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  phpmyadmin:
    image: phpmyadmin:5
    ports:
      - ${BIND_ADDRESS:-127.0.0.1}:${PMA_PORT:-8181}:80
    environment:
      PMA_HOST: db
      # Large enough to import a full site dump through the UI.
      UPLOAD_LIMIT: 512M
      MEMORY_LIMIT: 1G
      MAX_EXECUTION_TIME: 1200
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
