services:
  wordpress:
    build:
      context: .
    ports:
      - 8080:80
    volumes:
      - ./public:/var/www/html
      - ./plugins:/var/www/html/wp-content/plugins
      - ./themes:/var/www/html/wp-content/themes
      - ./uploads:/var/www/html/wp-content/uploads
      - ./wp.sh:/var/www/html/wp.sh
      - ./phpconf.ini:/usr/local/etc/php/conf.d/phpconf.ini
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: ${DB_NAME:-wordpress}
      WORDPRESS_DB_USER: ${DB_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:-wordpress}
    depends_on:
      mailhog:
        condition: service_started
      db:
        condition: service_healthy

  mailhog:
    image: mailhog/mailhog
    ports:
      - 1025:1025
      - 8025:8025

  wpcli:
    image: tatemz/wp-cli
    volumes:
      - ./public:/var/www/html
      - ./plugins:/var/www/html/wp-content/plugins
      - ./themes:/var/www/html/wp-content/themes
      - ./uploads:/var/www/html/wp-content/uploads
      - ./wp.sh:/var/www/html/wp.sh
    command: sh wp.sh

  db:
    image: mariadb:lts
    ports:
      - ${DB_PORT:-3308}:3306
    volumes:
      - db_data:/var/lib/mysql
    environment:
      MARIADB_DATABASE: ${DB_NAME:-wordpress}
      MARIADB_USER: ${DB_USER:-wordpress}
      MARIADB_PASSWORD: ${DB_PASSWORD:-wordpress}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-docker}
    # Lets wordpress (and anything scripted right after `up -d`) wait for the
    # first-run initialisation instead of racing it.
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    ports:
      - 8181:80
    restart: always
    environment:
      MYSQL_USERNAME: root
      MYSQL_ROOT_PASSWORD: docker
      MYSQL_PORT_3306_TCP_ADDR: db

volumes:
  db_data:
