# Database connection shared by the wordpress and wpcli services.
x-wordpress-db: &wordpress-db
  WORDPRESS_DB_HOST: db
  WORDPRESS_DB_NAME: ${DB_NAME:-wordpress}
  WORDPRESS_DB_USER: ${DB_USER:-wordpress}
  WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:-wordpress}

services:
  wordpress:
    build:
      context: .
    ports:
      - 8080:80
    volumes:
      - ./public:/var/www/html
      - ./plugins:/var/www/html/wp-content/plugins
      - ./themes:/var/www/html/wp-content/themes
      - ./uploads:/var/www/html/wp-content/uploads
      - ./phpconf.ini:/usr/local/etc/php/conf.d/phpconf.ini
    extra_hosts:
      # Lets Xdebug reach the IDE on Linux hosts too (built in on Docker Desktop).
      - host.docker.internal:host-gateway
    environment:
      <<: *wordpress-db
      XDEBUG_MODE: ${XDEBUG_MODE:-debug}
    # Healthy once the entrypoint has copied WordPress core into ./public and
    # written wp-config.php, so wpcli can run against it.
    healthcheck:
      test: [CMD, test, -f, /var/www/html/wp-config.php]
      interval: 2s
      timeout: 2s
      retries: 30
    depends_on:
      mailpit:
        condition: service_started
      db:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:v1.34
    ports:
      - ${MAILPIT_PORT:-8025}:8025
      - ${MAILPIT_SMTP_PORT:-1025}:1025

  # Runs ./wp.sh on every `docker compose up`, then exits. For one-off
  # commands: docker compose run --rm wpcli wp <command>
  wpcli:
    image: wordpress:cli-php8.5
    # Same uid/gid as Apache's www-data (33) in the wordpress image; the CLI
    # image is Alpine, where www-data is 82 and could not write core files.
    user: "33:33"
    # Keep these in sync with the wordpress service.
    volumes:
      - ./public:/var/www/html
      - ./plugins:/var/www/html/wp-content/plugins
      - ./themes:/var/www/html/wp-content/themes
      - ./uploads:/var/www/html/wp-content/uploads
      - ./wp.sh:/usr/local/bin/wp.sh:ro
    environment:
      <<: *wordpress-db
      HOME: /tmp
    command: [sh, /usr/local/bin/wp.sh]
    depends_on:
      wordpress:
        condition: service_healthy

  db:
    image: mariadb:lts
    ports:
      - ${DB_PORT:-3308}:3306
    volumes:
      - db_data:/var/lib/mysql
    environment:
      MARIADB_DATABASE: ${DB_NAME:-wordpress}
      MARIADB_USER: ${DB_USER:-wordpress}
      MARIADB_PASSWORD: ${DB_PASSWORD:-wordpress}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-docker}
    # Lets wordpress (and anything scripted right after `up -d`) wait for the
    # first-run initialisation instead of racing it.
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  phpmyadmin:
    image: phpmyadmin:5
    ports:
      - ${PMA_PORT:-8181}:80
    environment:
      PMA_HOST: db
      # Large enough to import a full site dump through the UI.
      UPLOAD_LIMIT: 512M
      MEMORY_LIMIT: 1G
      MAX_EXECUTION_TIME: 1200
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
