; Xdebug 3. The mode can be overridden per run with the XDEBUG_MODE
; environment variable (see compose.yaml), e.g. XDEBUG_MODE=off.
xdebug.mode = debug
; Start a session only when the request carries the trigger (browser
; extension, XDEBUG_TRIGGER cookie/GET/POST parameter, or env variable).
xdebug.start_with_request = trigger
xdebug.client_host = host.docker.internal
xdebug.client_port = 9003
xdebug.idekey = docker
xdebug.cli_color = 1
